name: codequest

services:
  # ==========================================
  # DMZ / EDGE REVERSE PROXY
  # ==========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: codequest-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      dmz_net:
        ipv4_address: 172.20.0.2
      app_net:
        ipv4_address: 172.21.0.2
    depends_on:
      - web
      - api

  # ==========================================
  # FRONT-END STATIQUE REACT / VITE
  # ==========================================
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: codequest-web
    restart: unless-stopped
    networks:
      dmz_net:
        ipv4_address: 172.20.0.3

  # ==========================================
  # API BACKEND (NESTJS)
  # ==========================================
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: codequest-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-codequest}:${POSTGRES_PASSWORD:-codequest_secret}@postgres:5432/${POSTGRES_DB:-codequest}?schema=public
      - REDIS_CACHE_URL=redis://redis-cache:6379
      - REDIS_BULLMQ_HOST=redis-bullmq
      - REDIS_BULLMQ_PORT=6380
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_codequest_2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super_secret_refresh_key_codequest_2026}
      - S3_ENDPOINT=minio
      - S3_PORT=9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-codequest_admin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-codequest_s3_secret}
      - ASSETS_SERVICE_URL=http://assets:8000
    networks:
      app_net:
        ipv4_address: 172.21.0.10
      data_net:
        ipv4_address: 172.22.0.10
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-bullmq:
        condition: service_healthy

  # ==========================================
  # RUNNER DAEMON (BULLMQ WORKER)
  # ==========================================
  runner:
    build:
      context: ..
      dockerfile: services/runner/Dockerfile
    container_name: codequest-runner
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis-bullmq
      - REDIS_PORT=6380
      - RUNNER_CONCURRENCY=2
    networks:
      runner_net:
        ipv4_address: 172.23.0.2
      data_net:
        ipv4_address: 172.22.0.20
    depends_on:
      - redis-bullmq

  # ==========================================
  # SERVICE ASSETS (FASTAPI PYTHON)
  # ==========================================
  assets:
    build:
      context: ../services/assets
      dockerfile: Dockerfile
    container_name: codequest-assets
    restart: unless-stopped
    networks:
      app_net:
        ipv4_address: 172.21.0.20

  # ==========================================
  # BASE DE DONNÉES (POSTGRESQL 16)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: codequest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codequest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codequest_secret}
      POSTGRES_DB: ${POSTGRES_DB:-codequest}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      data_net:
        ipv4_address: 172.22.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codequest}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # REDIS CACHE & SESSIONS
  # ==========================================
  redis-cache:
    image: redis:7-alpine
    container_name: codequest-redis-cache
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_cache_data:/data
    networks:
      data_net:
        ipv4_address: 172.22.0.3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # REDIS BULLMQ (FILE DÉDIÉE NOEVICTION)
  # ==========================================
  redis-bullmq:
    image: redis:7-alpine
    container_name: codequest-redis-bullmq
    restart: unless-stopped
    command: ["redis-server", "--port", "6380", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_bullmq_data:/data
    networks:
      data_net:
        ipv4_address: 172.22.0.4
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # STOCKAGE OBJETS S3 (MINIO)
  # ==========================================
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: codequest-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-codequest_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-codequest_s3_secret}
    volumes:
      - minio_data:/data
    networks:
      data_net:
        ipv4_address: 172.22.0.5

  # ==========================================
  # RELAIS E-MAIL SMTP (DEVELOPPEMENT)
  # ==========================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: codequest-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025" # Interface web de consultation
    networks:
      app_net:
        ipv4_address: 172.21.0.35

networks:
  dmz_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
  data_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.22.0.0/24
  runner_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24

volumes:
  postgres_data:
  redis_cache_data:
  redis_bullmq_data:
  minio_data:

